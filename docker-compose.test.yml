services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_test"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pg_test_data:/var/lib/postgresql/data

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_test?schema=public
      PRISMA_DATABASE_ADAPTER: pg
      HOST_UID: "${HOST_UID}"
      HOST_GID: "${HOST_GID}"
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      AUTH_SECRET: e2e_ci_auth_secret_must_be_at_least_32_chars
      AUTH_URL: http://127.0.0.1:3000
      CI: "true"
      REDIS_URL: redis://127.0.0.1:6379
    volumes:
      - .:/workspace:z
    command: ["bash", "-lc", "bash /workspace/scripts/test-docker.sh"]

volumes:
  pg_test_data:
