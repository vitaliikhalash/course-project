services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_test"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pg_test_data:/var/lib/postgresql/data

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app_test?schema=public
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      CI: "true"
      REDIS_URL: redis://127.0.0.1:6379
    volumes:
      - .:/workspace
    command: ["bash", "-lc", "./scripts/test-docker.sh"]

volumes:
  pg_test_data:
