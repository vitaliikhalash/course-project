name: course-project-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_local
    ports:
      - "5632:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_local"]
      interval: 3s
      timeout: 5s
      retries: 20
    volumes:
      - pg_local_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  pg_local_data:
